name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      appstore_upload:
        description: 'Mac App Store: upload the validated .pkg to App Store Connect (needs the app record and the MAS signing secrets)'
        type: boolean
        default: false
      appstore_build_number:
        description: 'Mac App Store: CFBundleVersion for this build (empty = workflow run number)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  VERSION: 0.7.0

jobs:
  scene:
    name: Render scene (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in web/js/*.js; do node --check "$f"; done
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render previews
        run: node tools/screenshot.mjs previews "view=moon" "view=home" "view=sunrise" "view=moon&earthPosition=0.6@2560x1080"
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews/*.png

  windows:
    name: Windows app + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ env.VERSION }}'
          if ('${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      # ESO/S. Brunier Milky Way panorama (CC BY 4.0), bundled so the sky needs no download.
      - name: Fetch Milky Way panorama
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri 'https://cdn.eso.org/images/large/eso0932a.jpg' -OutFile web/assets/milkyway_eso.jpg -UserAgent '3DEarth-build'
          Get-Item web/assets/milkyway_eso.jpg | Select-Object Name, Length

      # Report whether the optional Earth surface maps are reachable (informational).
      - name: Check surface map sources
        shell: pwsh
        continue-on-error: true
        run: |
          $urls = @(
            'https://www.solarsystemscope.com/textures/download/8k_earth_daymap.jpg'
          )
          $ids = '73580','73605','73630','73655','73701','73726','73751','73776','73801','73826','73884','73909'
          for ($m = 1; $m -le 12; $m++) {
            $mm = '{0:D2}' -f $m
            $urls += "https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/$($ids[$m-1])/world.topo.bathy.2004$mm.3x21600x10800.jpg"
          }
          foreach ($u in $urls) {
            try {
              # Same user agent as the app; a ranged GET works where HEAD is refused.
              $r = Invoke-WebRequest -Uri $u -Headers @{ Range = 'bytes=0-1023' } -MaximumRedirection 5 `
                     -UserAgent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) 3DEarth/0.6 (+https://github.com/vagdesign/3D-Earth)'
              "OK   $($r.StatusCode) $($r.Headers['Content-Range']) $u"
            } catch { "FAIL $($_.Exception.Response.StatusCode.value__) $u" }
          }

      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/ThreeDEarth/ThreeDEarth.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Verify output
        shell: pwsh
        run: |
          foreach ($f in 'publish/3DEarth.exe', 'publish/web/index.html', 'publish/web/js/main.js', 'publish/web/assets/earth_day.jpg', 'publish/WebView2Loader.dll') {
            if (!(Test-Path $f)) { throw "missing $f" }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=..\publish" installer\3DEarth.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "out\3DEarth-portable-${{ steps.ver.outputs.version }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 3DEarth-${{ steps.ver.outputs.version }}-win-x64
          path: out/*

  mac:
    name: macOS app (universal, notarized)
    runs-on: macos-latest
    outputs:
      # 'true' only when the app was Developer ID signed, notarized (Accepted) and stapled.
      notarized: ${{ steps.staple.outputs.notarized || 'false' }}
      dmg: ${{ steps.dmg.outputs.dmg || 'false' }}
    env:
      # Override with a repository variable if the certificate is ever reissued under another name.
      MACOS_SIGN_IDENTITY: "${{ vars.MACOS_SIGN_IDENTITY || 'Developer ID Application: Evangelos Makrydakis (7BMSHL4YZ6)' }}"
      APP: out/3D Earth.app
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          v='${{ env.VERSION }}'
          if [ '${{ github.ref_type }}' = 'tag' ]; then v='${{ github.ref_name }}'; v="${v#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Same ESO/S. Brunier Milky Way panorama as the Windows build (CC BY 4.0).
      - name: Fetch Milky Way panorama
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -A '3DEarth-build' -o web/assets/milkyway_eso.jpg https://cdn.eso.org/images/large/eso0932a.jpg
          ls -la web/assets/milkyway_eso.jpg
      - name: Build 3D Earth.app (universal)
        run: |
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
          mac/build.sh ${{ steps.ver.outputs.version }}
      - name: Check bundle
        run: |
          set -euo pipefail
          archs="$(lipo -archs "$APP/Contents/MacOS/3DEarth")"
          echo "lipo -archs: $archs"
          case " $archs " in *" arm64 "*) ;; *) echo "::error::arm64 slice missing"; exit 1;; esac
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::x86_64 slice missing"; exit 1;; esac
          plutil -lint "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          otool -l "$APP/Contents/MacOS/3DEarth" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|platform' | sort -u
          for f in web/index.html web/js/main.js web/lib/three.module.js web/assets/earth_day.jpg AppIcon.icns; do test -f "$APP/Contents/Resources/$f"; done
          codesign --verify --verbose "$APP"

      # ---- Developer ID signing + notarization (skipped when the secrets are absent, e.g. forks) ----
      - name: Signing mode
        id: mode
        env:
          HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
          HAVE_API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
        run: |
          if [ "$HAVE_CERT" = true ] && [ "$HAVE_API_KEY" = true ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Signing with Developer ID and notarizing."
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS signing::Signing secrets not available: keeping the ad-hoc signature (not notarized)."
          fi
      - name: Import Developer ID certificate into a temporary keychain
        if: steps.mode.outputs.sign == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KC="$RUNNER_TEMP/3dearth-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "::add-mask::$KC_PASS"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KC" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Apple's Developer ID G2 intermediate (public), pinned by SHA-256, so codesign can build the chain.
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
      - name: Sign with Developer ID (hardened runtime, secure timestamp)
        if: steps.mode.outputs.sign == 'true'
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict -vv "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E '^(Identifier=|Format=|CodeDirectory |Authority=|Timestamp=|TeamIdentifier=|Runtime Version=)'
      - name: Notarize (notarytool)
        id: notarize
        if: steps.mode.outputs.sign == 'true'
        timeout-minutes: 45
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          KEY="$RUNNER_TEMP/notary/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notary/3DEarth-notarize.zip"
          set +e
          xcrun notarytool submit "$RUNNER_TEMP/notary/3DEarth-notarize.zip" \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 40m --output-format json > "$RUNNER_TEMP/notary/result.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/notary/result.json"; echo
          id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary/result.json" 2>/dev/null || true)"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary/result.json" 2>/dev/null || true)"
          echo "Notarization status: ${status:-unknown} (submission ${id:-none}, notarytool exit $rc)"
          if [ -n "$id" ]; then
            echo "---- notary log ----"
            xcrun notarytool log "$id" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
          fi
          if [ "$status" != "Accepted" ]; then
            echo "::error title=Notarization::status '${status:-unknown}' (expected Accepted)"
            exit 1
          fi
          echo "::notice title=Notarization (app)::Accepted, submission $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Staple + Gatekeeper check
        id: staple
        if: steps.mode.outputs.sign == 'true'
        run: |
          set -euo pipefail
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict -vv "$APP"
          spctl -a -vv -t exec "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'accepted' "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test (launch on the desktop, snapshot + screenshot)
        continue-on-error: true
        timeout-minutes: 10
        run: mac/test/smoke.sh "$APP" out/mac-shot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke-test
          path: out/mac-shot/

      - name: Zip
        run: |
          set -euo pipefail
          cd out
          ZIP="3D-Earth-mac-${{ steps.ver.outputs.version }}.zip"
          ditto -c -k --keepParent "3D Earth.app" "$ZIP"
          # Check the app as users will get it: unpacked from the release zip.
          rm -rf zipcheck && mkdir zipcheck && ditto -x -k "$ZIP" zipcheck
          codesign --verify --deep --strict -vv "zipcheck/3D Earth.app"
          lipo -archs "zipcheck/3D Earth.app/Contents/MacOS/3DEarth"
          if [ '${{ steps.staple.outputs.notarized }}' = true ]; then
            xcrun stapler validate "zipcheck/3D Earth.app"
            spctl -a -vv -t exec "zipcheck/3D Earth.app"
          fi
          rm -rf zipcheck
          shasum -a 256 "$ZIP"

      # Disk image (drag to Applications), signed, notarized and stapled on its own.
      - name: Disk image
        id: dmg
        if: steps.staple.outputs.notarized == 'true'
        continue-on-error: true
        timeout-minutes: 45
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="out/3D-Earth-mac-${{ steps.ver.outputs.version }}.dmg"
          rm -rf out/dmg-root && mkdir -p out/dmg-root
          ditto "$APP" "out/dmg-root/3D Earth.app"
          ln -s /Applications out/dmg-root/Applications
          for i in 1 2 3; do
            hdiutil create -volname "3D Earth" -srcfolder out/dmg-root -fs HFS+ -format UDZO -ov "$DMG" && break
            sleep 5
          done
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          KEY="$RUNNER_TEMP/notary/AuthKey_${APPLE_API_KEY_ID}.p8"
          set +e
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 40m --output-format json > "$RUNNER_TEMP/notary/dmg.json"
          set -e
          cat "$RUNNER_TEMP/notary/dmg.json"; echo
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary/dmg.json" 2>/dev/null || true)"
          id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary/dmg.json" 2>/dev/null || true)"
          if [ "$status" != "Accepted" ]; then echo "::warning title=Disk image::notarization status '${status:-unknown}'"; rm -f "$DMG"; exit 1; fi
          echo "::notice title=Notarization (dmg)::Accepted, submission $id"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          shasum -a 256 "$DMG"
          echo "dmg=true" >> "$GITHUB_OUTPUT"
      - name: Drop an unfinished disk image
        if: steps.dmg.outputs.dmg != 'true'
        run: rm -f out/3D-Earth-mac-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Earth-${{ steps.ver.outputs.version }}-mac
          path: |
            out/3D-Earth-mac-*.zip
            out/3D-Earth-mac-*.dmg
          if-no-files-found: error
      - name: Remove temporary keychain and API key
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  # ---- Mac App Store variant ------------------------------------------------
  # Every run (pull requests too, no secrets needed): build the sandboxed App
  # Store variant (ad-hoc signed) and launch it on the runner to prove it works
  # inside the App Sandbox.
  mac-appstore-sandbox:
    name: macOS App Store variant (sandboxed build + launch test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: |
          v='${{ env.VERSION }}'
          if [ '${{ github.ref_type }}' = 'tag' ]; then v='${{ github.ref_name }}'; v="${v#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Fetch Milky Way panorama
        continue-on-error: true
        run: curl -fsSL --retry 3 -A '3DEarth-build' -o web/assets/milkyway_eso.jpg https://cdn.eso.org/images/large/eso0932a.jpg
      - name: Build 3D Earth.app (App Store variant, sandboxed, ad-hoc signed)
        run: mac/build.sh --appstore ${{ steps.ver.outputs.version }} ${{ github.run_number }}
      - name: Check bundle
        run: |
          set -euo pipefail
          APP="out/appstore/3D Earth.app"
          lipo -archs "$APP/Contents/MacOS/3DEarth"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$APP/Contents/Info.plist")" = false
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = '${{ github.run_number }}'
          iconutil -c iconset -o "$RUNNER_TEMP/icon.iconset" "$APP/Contents/Resources/AppIcon.icns"
          sips -g pixelWidth "$RUNNER_TEMP/icon.iconset/icon_512x512@2x.png"
          codesign --verify --strict -vv "$APP"
      - name: Sandbox launch test
        timeout-minutes: 10
        run: mac/test/sandbox.sh "out/appstore/3D Earth.app" out/appstore-shot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-appstore-sandbox-test
          path: out/appstore-shot/

  # Manual runs (Actions → Build → Run workflow) and v* tags only, never pull
  # requests. Needs the Mac App Store signing secrets (skipped cleanly without
  # them): signs with Apple Distribution + the provisioning profile, wraps the
  # app in an installer package signed with Mac Installer Distribution and
  # validates it with App Store Connect. Uploading is a separate, explicit
  # choice (input "appstore_upload"), and only on manual runs.
  mac-appstore:
    name: Mac App Store package (sign, validate, optional upload)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [mac-appstore-sandbox]
    runs-on: macos-latest
    env:
      APP: out/appstore/3D Earth.app
      BUNDLE_ID: com.axeasy.3DEarth
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '7BMSHL4YZ6' }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing mode
        id: mode
        env:
          HAVE_MAS: ${{ secrets.MAS_APP_CERT_P12_BASE64 != '' && secrets.MAS_APP_CERT_PASSWORD != '' && secrets.MAS_INSTALLER_CERT_P12_BASE64 != '' && secrets.MAS_INSTALLER_CERT_PASSWORD != '' && secrets.MAS_PROVISIONING_PROFILE_BASE64 != '' }}
          HAVE_API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
        run: |
          if [ "$HAVE_MAS" = true ] && [ "$HAVE_API_KEY" = true ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mac App Store::Signing secrets (MAS_APP_CERT_*, MAS_INSTALLER_CERT_*, MAS_PROVISIONING_PROFILE_BASE64, APPLE_API_*) not all set: skipping the App Store package."
          fi
      - name: Version and build number
        id: ver
        if: steps.mode.outputs.sign == 'true'
        run: |
          v='${{ env.VERSION }}'
          if [ '${{ github.ref_type }}' = 'tag' ]; then v='${{ github.ref_name }}'; v="${v#v}"; fi
          # CFBundleVersion must grow with every upload: the workflow run number does,
          # unless a manual run sets appstore_build_number.
          b='${{ inputs.appstore_build_number }}'
          [ -n "$b" ] || b='${{ github.run_number }}'
          case "$b" in *[!0-9.]*|'') echo "::error::bad build number '$b'"; exit 1;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=$b" >> "$GITHUB_OUTPUT"
          echo "Mac App Store build: version $v, build $b"
      - name: Fetch Milky Way panorama
        if: steps.mode.outputs.sign == 'true'
        run: curl -fsSL --retry 3 -A '3DEarth-build' -o web/assets/milkyway_eso.jpg https://cdn.eso.org/images/large/eso0932a.jpg
      - name: Build 3D Earth.app (App Store variant)
        if: steps.mode.outputs.sign == 'true'
        run: mac/build.sh --appstore ${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.build }}
      - name: Import Apple Distribution + Mac Installer Distribution certificates
        if: steps.mode.outputs.sign == 'true'
        env:
          MAS_APP_CERT_P12_BASE64: ${{ secrets.MAS_APP_CERT_P12_BASE64 }}
          MAS_APP_CERT_PASSWORD: ${{ secrets.MAS_APP_CERT_PASSWORD }}
          MAS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAS_INSTALLER_CERT_P12_BASE64 }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KC="$RUNNER_TEMP/3dearth-mas.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "::add-mask::$KC_PASS"
          echo "MAS_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MAS_APP_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-app.p12"
          printf '%s' "$MAS_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mas-installer.p12"
          security import "$RUNNER_TEMP/mas-app.p12" -k "$KC" -f pkcs12 -P "$MAS_APP_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/mas-installer.p12" -k "$KC" -f pkcs12 -P "$MAS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/mas-app.p12" "$RUNNER_TEMP/mas-installer.p12"
          # Apple WWDR intermediates (public), pinned by SHA-256.
          for c in "AppleWWDRCAG3 dcf21878c77f4198e4b4614f03d696d89c66c66008d4244e1b99161aac91601f" \
                   "AppleWWDRCAG2 9ed4b3b88c6a339cf1387895bda9ca6ea31a6b5ce9edf7511845923b0c8ac94c"; do
            set -- $c
            curl -fsSL --retry 3 "https://www.apple.com/certificateauthority/$1.cer" -o "$RUNNER_TEMP/$1.cer"
            echo "$2  $RUNNER_TEMP/$1.cer" | shasum -a 256 -c -
            security import "$RUNNER_TEMP/$1.cer" -k "$KC" || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p basic "$KC" | tee "$RUNNER_TEMP/identities.txt"
          app_id="$(sed -nE 's/.*"((Apple Distribution|3rd Party Mac Developer Application): [^"]*)".*/\1/p' "$RUNNER_TEMP/identities.txt" | head -1)"
          inst_id="$(sed -nE 's/.*"((3rd Party Mac Developer Installer|Mac Installer Distribution): [^"]*)".*/\1/p' "$RUNNER_TEMP/identities.txt" | head -1)"
          [ -n "$app_id" ] || { echo "::error::no Apple Distribution identity in MAS_APP_CERT_P12_BASE64"; exit 1; }
          [ -n "$inst_id" ] || { echo "::error::no Mac Installer Distribution identity in MAS_INSTALLER_CERT_P12_BASE64"; exit 1; }
          echo "MAS_APP_IDENTITY=$app_id" >> "$GITHUB_ENV"
          echo "MAS_INSTALLER_IDENTITY=$inst_id" >> "$GITHUB_ENV"
          echo "App identity: $app_id / installer identity: $inst_id"
      - name: Embed the provisioning profile
        if: steps.mode.outputs.sign == 'true'
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          P="$APP/Contents/embedded.provisionprofile"
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$P"
          security cms -D -i "$P" > "$RUNNER_TEMP/profile.plist"
          plutil -p "$RUNNER_TEMP/profile.plist" | grep -E '"(Name|TeamName|ExpirationDate|application-identifier|com.apple.application-identifier|com.apple.developer.team-identifier)"' || true
          PB=/usr/libexec/PlistBuddy
          appid="$($PB -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/profile.plist")"
          test "$appid" = "$TEAM_ID.$BUNDLE_ID" || { echo "::error::profile is for '$appid', expected $TEAM_ID.$BUNDLE_ID"; exit 1; }
          if $PB -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::this is a development profile (it lists devices); a Mac App Store profile is needed"; exit 1
          fi
          # The signing entitlements: the sandbox set + the identifiers from the profile.
          cp mac/entitlements/appstore.entitlements "$RUNNER_TEMP/dist.entitlements"
          $PB -c "Add :com.apple.application-identifier string $TEAM_ID.$BUNDLE_ID" "$RUNNER_TEMP/dist.entitlements"
          $PB -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$RUNNER_TEMP/dist.entitlements"
          plutil -p "$RUNNER_TEMP/dist.entitlements"
      - name: Sign with Apple Distribution
        if: steps.mode.outputs.sign == 'true'
        run: |
          set -euo pipefail
          codesign --force --timestamp --keychain "$MAS_KEYCHAIN" --sign "$MAS_APP_IDENTITY" \
            --entitlements "$RUNNER_TEMP/dist.entitlements" "$APP"
          codesign --verify --deep --strict -vv "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E '^(Identifier=|Authority=|TeamIdentifier=|Timestamp=)'
          codesign -d --entitlements - --xml "$APP" | plutil -p -
      - name: Installer package (productbuild, Mac Installer Distribution)
        id: pkg
        if: steps.mode.outputs.sign == 'true'
        run: |
          set -euo pipefail
          PKG="out/3D-Earth-mac-appstore-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}.pkg"
          productbuild --component "$APP" /Applications --sign "$MAS_INSTALLER_IDENTITY" --keychain "$MAS_KEYCHAIN" "$PKG"
          pkgutil --check-signature "$PKG"
          shasum -a 256 "$PKG"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
      - name: Validate with App Store Connect (altool)
        if: steps.mode.outputs.sign == 'true'
        timeout-minutes: 30
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          # Needs the app record for com.axeasy.3DEarth in App Store Connect.
          xcrun altool --validate-app -f "${{ steps.pkg.outputs.pkg }}" -t macos \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" --output-format normal
          echo "::notice title=Mac App Store::validation passed for ${{ steps.pkg.outputs.pkg }}"
      - name: Upload to App Store Connect
        if: steps.mode.outputs.sign == 'true' && github.event_name == 'workflow_dispatch' && inputs.appstore_upload
        timeout-minutes: 45
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f "${{ steps.pkg.outputs.pkg }}" -t macos \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID" --output-format normal
          echo "::notice title=Mac App Store::uploaded build ${{ steps.ver.outputs.build }} (it appears in App Store Connect → TestFlight after processing)"
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.sign == 'true'
        with:
          name: 3D-Earth-mac-appstore-pkg
          path: out/3D-Earth-mac-appstore-*.pkg
          if-no-files-found: error
      - name: Remove temporary keychain and API key
        if: always()
        run: |
          if [ -n "${MAS_KEYCHAIN:-}" ]; then security delete-keychain "$MAS_KEYCHAIN" || true; fi
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP"/mas-*.p12

  # Every push to main (or a v* tag) publishes/updates the release for the
  # current version, so there is always a plain download page under Releases.
  # Pull requests and manual runs never reach this job.
  release:
    name: GitHub release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [scene, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 3DEarth-*-win-x64
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 3D-Earth-*-mac
          merge-multiple: true
      - name: Version
        id: ver
        run: |
          ls -la dist
          v='${{ env.VERSION }}'
          if [ '${{ github.ref_type }}' = 'tag' ]; then v='${{ github.ref_name }}'; v="${v#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ '${{ needs.mac.outputs.notarized }}' = true ]; then
            note='It is signed with Developer ID and notarized by Apple, so it opens normally.'
          else
            note='This build is not notarized: if macOS refuses to open it, run `xattr -dr com.apple.quarantine "/Applications/3D Earth.app"` once.'
          fi
          echo "macnote=$note" >> "$GITHUB_OUTPUT"
          if [ '${{ needs.mac.outputs.dmg }}' = true ]; then
            echo "macfile=\`3D-Earth-mac-$v.dmg\` (open it and drag **3D Earth** to Applications) or \`3D-Earth-mac-$v.zip\` (unzip, then move **3D Earth** to Applications)" >> "$GITHUB_OUTPUT"
          else
            echo "macfile=\`3D-Earth-mac-$v.zip\`, unzip it and move **3D Earth** to Applications" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 3D Earth ${{ steps.ver.outputs.version }}
          make_latest: true
          files: dist/*
          body: |
            **Windows: download `3DEarth-Setup-${{ steps.ver.outputs.version }}.exe` below and run it.**

            - Windows 10 (1809+) or Windows 11, x64. No administrator rights needed.
            - Windows SmartScreen may warn because the installer is not code-signed: click *More info → Run anyway*.
            - Needs the Microsoft Edge WebView2 Runtime (already on almost every PC; the installer offers the link if missing).
            - Prefer no installer? Use the portable `.zip`: unzip anywhere and run `3DEarth.exe`.
            - Already installed? The app updates itself: tray → *Check for updates* (it also checks automatically every 12 hours).

            **macOS 13 Ventura or later (Apple silicon and Intel):** download ${{ steps.ver.outputs.macfile }}, then open it. ${{ steps.ver.outputs.macnote }}
            - It lives in the menu bar (globe icon), with no Dock icon. *Open at login* is in that menu and in Settings.

            Built from ${{ github.sha }}.
