<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Earth</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden;
    font: 500 clamp(10px, 0.72vw, 15px)/1.25 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.06em; color: rgba(235, 242, 255, 0.78); }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform;
    text-shadow: 0 0 3px #000, 0 0 8px rgba(0,0,0,0.9); transition: opacity 0.6s; }
  .lbl.body { text-transform: uppercase; font-size: 0.82em; letter-spacing: 0.18em; opacity: 0.7; }
  .lbl.storm { display: flex; align-items: center; gap: 0.45em; }
  .lbl.storm i { width: 0.7em; height: 0.7em; border: 1.5px solid currentColor; border-radius: 50%;
    box-shadow: 0 0 6px currentColor; flex: none; }
  .lbl.storm small { opacity: 0.7; font-size: 0.85em; }
  #debug { position: fixed; left: 8px; bottom: 8px; font: 12px monospace; color: #8f8; white-space: pre; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script src="lib/astronomy.min.js"></script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
